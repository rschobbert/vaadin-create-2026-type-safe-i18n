# to suppress the warnings that come from the very old vaadin gradle plugin,
# we set the following property:
# (see also the comment in the build.gradle file)
org.gradle.warning.mode=none

# to also get rid of the console warning:
#   [Incubating] Problems report is available at: ...build/reports/problems/problems-report.html
# we set the following property:
org.gradle.problems.report=false
# that way, no problems report is generated, and therefore the [Incubating] message disappears.
