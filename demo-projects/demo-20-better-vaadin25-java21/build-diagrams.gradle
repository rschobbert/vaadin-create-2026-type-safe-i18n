        exclude classes().withNameLike("de.emesit.demo.JacksonConfig")
        exclude classes().withNameLike("de.emesit.demo.*Controller")
        exclude classes().withNameLike("de.emesit.demo.ui.AppLanguageWrapper1")
        
        exclude fields()
        exclude methods()
        
