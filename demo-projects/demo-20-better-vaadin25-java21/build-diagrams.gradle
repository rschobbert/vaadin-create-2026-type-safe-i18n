        exclude fields()
        include methods().of("*.I18n")
        include methods().of("*.I18nConfig").thatArePublic().orPackagePrivate().andNotStatic()
        exclude methods().of("de.emesit.demo.TranslationInitializer")
        exclude methods().of("de.emesit.demo.ui.*")
        exclude methods().of("de.emesit.demo.task.*")
        exclude methods().of("de.emesit.demo.i18n.Translation*")
        exclude methods().of("de.emesit.demo.i18n.*Language")
        
        add      association().from("*.AppLanguageWrapper2")   .to("*.I18nLanguageSupplier").withTargetArrow(">").withLineCharacter(".").withStyle("right")
        add      association().from("*.AppLanguageWrapper2")   .to("*.I18nBundleService")   .withTargetArrow(">").withLineCharacter(".").withStyle("right")
        add      association().from("*.I18nConfig")            .to("*.I18nClassSupplier")   .withTargetArrow(">").withLineCharacter(".").withStyle("left")
        add      association().from("*.I18nConfig")            .to("*.I18nLanguageSupplier").withTargetArrow(">").withLineCharacter(".").withStyle("right")
        add      association().from("*.I18nConfig")            .to("*.I18nBundleService")   .withTargetArrow(">").withLineCharacter(".").withStyle("right")
        add      association().from("*.I18nLanguageSupplier")  .to("*.I18nLanguage")        .withTargetArrow(">").withLineCharacter(".").withStyle("left")
        add      association().from("*.I18n")                  .to("*.TranslationDE")       .withTargetArrow(">").withLineCharacter(".").withStyle("down")
        add      association().from("*.I18n")                  .to("*.TranslationEN")       .withTargetArrow(">").withLineCharacter(".").withStyle("down")
        add      association().from("*.I18n")                  .to("*.TranslationES")       .withTargetArrow(">").withLineCharacter(".").withStyle("down")

        override extension  ().from("*.I18n")                  .to("*.I18nBase")    .withStyle("up")
        override extension  ().from("*.Language")              .to("*.I18nLanguage").withStyle("down")
        override association().from("*.AppLanguageWrapper2")   .to("*.I18n")        .withStyle("left")
        override association().from("*.AppLanguageWrapper2")   .to("*.I18nLanguage").withStyle("up")
        override association().from("*.TaskListView")          .to("*.I18n")        .withStyle("left")

        add     association().from("*.Demo*Application")   .to("*.TranslationInitializer").withStyle("[hidden]right")
        add      association().from("*.TranslationInitializer")     .to("*.I18nClassSupplier").withStyle("[hidden]right")
        
        add      association().from("*.I18nBundleService")     .to("*.I18nLanguageSupplier").withStyle("[hidden]up")
        add      association().from("*.TaskListView")          .to("*.I18nLanguageSupplier").withStyle("[hidden]right")
        add      association().from("*.TaskListView")          .to("*.I18nLanguage")        .withStyle("[hidden]right")
        
        
//        add     association().from("*.Demo*Application")   .to("*.TaskListView")        .withStyle("[hidden]")
//        add     association().from("*.Demo*Application")   .to("*.TranslationInitializer").withStyle("[hidden]")
        
//        add      association().from("*.Demo*Application")      .to("*.TranslationInitializer")      .withStyle("[hidden]down")
//        add      association().from("*.TranslationInitializer")      .to("*.AppLanguageWrapper2")      .withStyle("[hidden]right")
//        add      association().from("*.Demo*Application")      .to("*.I18nConfig").withStyle("[hidden]right")
//        add      association().from("*.I18nConfig")            .to("*.AppLanguageWrapper2").withStyle("[hidden]right")
//        add      association().from("*.I18nLanguageSupplier")            .to("*.I18nLanguage").withStyle("[hidden]down")
//        add      association().from("*.I18nLanguage")            .to("*.I18nBundleService").withStyle("[hidden]left")
//        add      association().from("*.I18nBase")            .to("*.I18nLanguageSupplier").withStyle("[hidden]right")
//        add      association().from("*.I18nLanguage")            .to("*.TaskListView").withStyle("[hidden]left")
//        add      association().from("*.Language")            .to("*.AppLanguageWrapper2").withStyle("[hidden]left")
//        add      association().from("*.Language")            .to("*.I18nBundleService").withStyle("[hidden]right")
        
        
//        override association().from("*.TaskListView")   .to("*.AppLanguageWrapper2").withStyle("left")
        
//        override association().from("*.AppLanguageWrapper2")   .to("*.I18nLanguage")          .withStyle("left")
//        override association().from("*.TaskListView")          .to("*.AppLanguageWrapper2")   .withStyle("up")
//        add      association().from("*.TranslationDE").to("*.TranslationEN")      .withStyle("[hidden]down")
//        add      association().from("*.TranslationEN").to("*.TranslationES")      .withStyle("[hidden]down")
        
        remove   association().from("*.Language").to("*.Language")
        
        renderTo file('overview-application-and-ui.svg')
    }
    
    classDiagram {
        name("Class Overview")
        style {
            directionLR()
            skinparam "packageStyle", "rectangle"
        }
        
        include(packages().withName("de.emesit.demo"))
        exclude(packages().withName("de.emesit.demo.ui"))
        exclude(packages().withName("de.emesit.demo.task"))
        exclude classes().withNameLike("de.emesit.demo.Demo20BetterApplication")
        exclude classes().withNameLike("de.emesit.demo.i18n.SimpleTranslationService")
