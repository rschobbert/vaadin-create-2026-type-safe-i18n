    // sieht ok aus:
    classDiagram {
        name("Packages i18n / i18n.internal")
        style {
            addStyle("<< InvocationHandler >> #line.bold").to(classes().withNameLike("*.I18nBundle\$I18nHandler"))
            directionLR()
            skinparam "packageStyle", "rectangle"
            skinparam "nodesep", "60"
            skinparam "ranksep", "120"
        }

        include packages().withName("de.emesit.demo.i18n")
        include packages().withName("de.emesit.demo.i18n.internal")
        exclude classes().withName("de.emesit.demo.i18n.SimpleTranslationService")
        exclude classes().withNameLike("de.emesit.demo.i18n.*Language")
        exclude classes().withNameLike("de.emesit.demo.*Controller")
        
        
        add      association().from("*.I18nBundle")           .to("*.I18nClassSupplier")      .withTargetArrow(">").withLineCharacter(".").withLabel("<<use>>")
        add      association().from("*.I18nBundle")           .to("*.I18nBundle\$I18nHandler").withTargetArrow(">").withLineCharacter(".").withStyle("right").withLabel(" <<instantiate>> ")
        add      association().from("*.I18nBundle")           .to("*.I18nMethodReader")       .withTargetArrow(">").withLineCharacter(".").withLabel("<<use>>")
        override association().from("*.I18nBundle")           .to("*.CustomTranslationService")     .withStyle("right")
        override association().from("*.I18nBaseBundleService").to("*.I18nBundle")             .withStyle("up")
        override extension  ().from("*.I18nBundleService")    .to("*.I18nBaseBundleService")  .withStyle("left")
        override association().from("*.I18nMethodReader")     .to("*.I18nLanguageSupplier")   .withStyle("right")
        add      association().from("*.I18n")                 .to("*.TranslationDE")          .withTargetArrow(">").withLineCharacter(".").withLabel("<<use>>")
        add      association().from("*.I18n")                 .to("*.TranslationEN")          .withTargetArrow(">").withLineCharacter(".").withLabel("<<use>>")
        add      association().from("*.I18n")                 .to("*.TranslationES")          .withTargetArrow(">").withLineCharacter(".").withLabel("<<use>>")

        remove   association().from("*.I18nClassSupplier")    .to("*.I18nBase")
        
        exclude methods().of("*.I18n")
        exclude methods().of("*.I18nBundle\$I18nHandler")
        
        renderTo file('package-i18n-internal.svg')
    }
    
