//***********************************************************************
// utility method to create and collect filenames
// of rendered diagrams, in order to generate an html page
// for viewing
// ----------------------------------------------------------------------
File toRenderFile(String pkg, String diagramType, String renderFormat) {
    if ( ! pkg ==~ /${projectMainPackage}(\..*)?/) {
        throw new GradleException("plugin package does not match the configure package in ext.projectMainPackage: '$projectMainPackage'")
    }
    
    String subpkg = (pkg == projectMainPackage) ? '' : (pkg - projectMainPackage)[1..-1] // if it is a subpackage, cut the leading '.'
    
    // create a filename based on the method params
    // if subpkg is empty, we omit the second '-'
    String filename = "plugin-${subpkg}${subpkg?'-':''}overview.$renderFormat"
    // add the file to our list
    createdSvgFiles << filename
    file("$diagramOutput/$filename")
}



//***********************************************************************
// utility base class for SvgOverviewMdFile and SvgOverviewHtmlFile
// ----------------------------------------------------------------------

class SvgOverviewFile {
    File   file
    String heading = 'Class Diagrams of the plantuml-gradle-plugin'
    String intro = '''The following are diagrams, generated with the plantuml-gradle-plugin
                     |for a better understanding of the architecture of the plugin.
                     |To create the svg diagrams and this file call:'''.stripMargin()
    String exampleCall
    String taskName = ''
    
    List svgFiles
    
    void write() {
        file.withWriter { w ->
            write(w)
        }
    }
    void write(Writer w) {
    }
}

//***********************************************************************
// utility class to write a markdown file for viewing the rendered svgs
// ----------------------------------------------------------------------

@groovy.transform.MapConstructor( includeSuperProperties = true,  post = { exampleCall = './gradlew '+taskName } )
class SvgOverviewMdFile extends SvgOverviewFile {
    void write(Writer w) {
        w << """# $heading
            |
            |$intro
            |
            |`$exampleCall`
            |""".stripMargin()
        svgFiles.each { s ->
            w << "\n---"
            w << "\n  "
            w << "\n### $s"
            w << "\n"
            w << "\n![$s](./$s)"
            w << "\n"
            w << "\n### <a href='$s'>Show only $s</a>\n"
        }
    }
}

//***********************************************************************
// utility class to write an html file for viewing the rendered svgs
// ----------------------------------------------------------------------

@groovy.transform.MapConstructor( includeSuperProperties = true,  post = { exampleCall = './gradlew '+taskName } )
class SvgOverviewHtmlFile extends SvgOverviewFile {
    void write(Writer w) {
        w << """<html>
            |<body>
            |<h1>$heading</h1>
            |<p>$intro</p>
            |<code>$exampleCall</code>
            |""".stripMargin()
        svgFiles.each { s ->
            w << "\n    <hr>"
            w << "\n    <br>"
            w << "\n    <h3>$s</h3>"
            w << "\n    <img src='$s' alt='$s' />"
            w << "\n    <br>"
            w << "\n    <h3><a href='$s'>Show only $s</a></h3>\n"
        }
        w << """</body>
            |</html>
            """.stripMargin()
    }
}