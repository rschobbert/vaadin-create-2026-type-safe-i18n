// This build file gets called, by calling gradle build with 'generateDiagrams' task.
// Selecting appropriate buildfile is done in settings.gradle


plugins {
    alias(libs.plugins.plantuml)
}

description = 'generate class diagrams with plantuml'


ext {
    projectMainPackage = 'de.emesit.demo'
    diagramOutput     = 'doc/generated'
    renderFormats     = ['svg']
    createdSvgFiles   = []
    diagramsHtmlFile  = 'diagrams.html'  // write an html file for local viewing
    diagramsMdFile    = 'diagrams.md'    // write a markdown file for online viewing e.g. github
}

configurations {
  plantuml
}

dependencies {
  plantuml  "net.sourceforge.plantuml:plantuml-mit:1.2026.8"
}

tasks.register('generateDiagrams') {
    dependsOn generateClassDiagrams
    // because of configurationCache, we cannot directly access project.createdSvgFiles
    // in doLast block, therefore define a variable here
    List svgFiles = project.createdSvgFiles
    File htmlFile = new File(project.diagramOutput, project.diagramsHtmlFile)
    File mdFile   = new File(project.diagramOutput, project.diagramsMdFile)
    doLast {
        new SvgOverviewHtmlFile(file:htmlFile, taskName:name, svgFiles:svgFiles).write()
        println "wrote [$htmlFile]"
        
        new SvgOverviewMdFile  (file:mdFile, taskName:name, svgFiles:svgFiles).write()
        println "wrote [$mdFile]"
    }
}

