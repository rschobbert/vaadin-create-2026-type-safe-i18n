spring.application.name=demo

easi18n.i18nClass=de.emesit.demo.i18n.I18n
easi18n.methodOverrideMode=FIRST_WINS
easi18n.i18nProxyInterfaces=de.emesit.demo.i18n.I18nMsg
easi18n.initialTranslationsResource=classpath:initial-translations.json

# disable serializing session to disk
server.servlet.session.persistent=false

spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console