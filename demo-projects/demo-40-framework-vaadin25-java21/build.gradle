project(gradle.subPrj.vaasboot) {
    apply plugin: 'app.java-conventions'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'com.vaadin'
    
    dependencies {
        api             project(gradle.subPrj.vaadin)
        api             project(gradle.subPrj.sbootstrt)
        
        api                 libs.bundles.vaasboot.api
