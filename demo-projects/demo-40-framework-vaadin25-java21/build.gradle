// * the repositories definition is in 'settings.gradle'
// * the dependencies definition is found in 'gradle/libs.versions.toml'
// * this buildfile was written for gradle 8.14.X
// * the task 'generateDiagrams' calls 'build-diagrams.gradle', see 'settings.gradle'

plugins {
    id  'app.root-convention'
    alias(libs.plugins.springboot) apply false
    alias(libs.plugins.vaadin)     apply false
}

project(gradle.subPrj.core) {
    apply plugin: 'app.java-conventions'
    apply plugin: 'java-test-fixtures'
    
    dependencies {
        testImplementation  platform(libs.bom.junit)
        
        api                 libs.bundles.core.api
        implementation      libs.bundles.core.impl
        testImplementation  libs.bundles.core.testimpl
        testRuntimeOnly     libs.bundles.core.testrtonly
    }
    
    
    
    tasks.register('generateTranslationAnnotations') {
        group = 'localization'
        description = 'Generates Java translation annotation interfaces based on the Language enum.'
    
        // Configuration: Adjust target package and output directory
        def targetPackage = 'de.emesit.easi18n'
        def outputDir = file("src/main/java/${targetPackage.replace('.', '/')}")
    
        // List of all languages to generate
        def languages = [
            'DE', 'ES', 'IT', 'PL', 'NL', 'TR', 'RU', 'UA', 'SE', 'DK',
            'NO', 'FI', 'CZ', 'SK', 'HU', 'RO', 'BG', 'HR', 'SI', 'GR',
            'EE', 'LV', 'LT', 'IS', 'EN', 'ZH', 'PT',
            
            // helper 'language' for countries US, TW and BR
            'US', 'BR', 'TW'
        ]
    
        doLast {
            // Ensure the directory exists
            if (!outputDir.exists()) {
                outputDir.mkdirs()
            }
    
            languages.each { lang ->
                def className = "Translation${lang}"
                def file = new File(outputDir, "${className}.java")
    
                def fileContent = """\
                    package ${targetPackage};
                    
                    import java.lang.annotation.Retention;
                    import java.lang.annotation.RetentionPolicy;
                    
                    /**
                     * Translation annotation for ${lang}.
                     * Automatically generated by Gradle task.
                     */
                    @Retention(RetentionPolicy.RUNTIME)
                    public @interface ${className} {
                        String value();
                    }
                    """.stripIndent()
    
                file.write(fileContent, "UTF-8")
                logger.lifecycle("Generated: ${file.absolutePath}")
            }
        }
    }
    
}

project(gradle.subPrj.sbootstrt) {
    apply plugin: 'app.java-conventions'
    apply plugin: 'org.springframework.boot'
    
    tasks.named('bootJar') { enabled = false }
    tasks.named('jar')     { enabled = true  }
    
    dependencies {
        api                 project(gradle.subPrj.core)
        api                 platform(libs.bom.springboot)
        
        api                 libs.bundles.sbootstrt.api
        testImplementation  libs.bundles.sbootstrt.testimpl
//        testRuntimeOnly     libs.bundles.sbootstrt.testrtonly
    }
}

project(gradle.subPrj.vaadin) {
    apply plugin: 'app.java-conventions'
