plugins {
    id 'groovy-gradle-plugin'
    id 'eclipse'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation  gradleApi()
}

test {
    useJUnitPlatform()
}


def eclipseResourceEncoding = tasks.register('eclipseResourceEncoding')
tasks.named('eclipse'){ dependsOn(eclipseResourceEncoding) }
eclipse.synchronizationTasks(eclipseResourceEncoding)  // run the task on "Refresh Gradle Project"

eclipseResourceEncoding.configure {
    ext.eclipseResourcePrefsFile = file('.settings/org.eclipse.core.resources.prefs')
    def compileTask = tasks.findByName('compileGroovy')
    ext.encoding = provider({ compileTask?.options?.encoding }).orElse( provider { 'UTF-8' } )
    
    inputs.property("file.encoding", encoding)
    outputs.file(eclipseResourcePrefsFile).withPropertyName('eclipseResourcePrefsFile')
    doLast {
        Properties eclipseEncodingProperties = new Properties(Collections.singletonMap('eclipse.preferences.version','1'))
        eclipseEncodingProperties.put('encoding/<project>', encoding.get())
        eclipseResourcePrefsFile.withOutputStream { eclipseEncodingProperties.store(it, "generated by gradle $name task in project ${project.name}") }
    }
}
